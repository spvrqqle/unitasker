<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1281FF"/>
      <stop offset="1" stop-color="#0354FA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#0A1F44" flood-opacity="0.28"/>
    </filter>
    <clipPath id="clip">
      <rect x="80" y="80" width="352" height="352" rx="82" ry="82"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="#FFFFFF"/>

  <rect x="80" y="80" width="352" height="352" rx="82" ry="82" fill="url(#g)" filter="url(#shadow)"/>

  <!-- long shadow cast by the dial -->
  <g clip-path="url(#clip)">
    <path d="M339.7 164.3 L622.7 447.3 L447.3 622.7 L164.3 339.7 A124 124 0 0 1 339.7 164.3 Z"
          fill="#001B5E" fill-opacity="0.10"/>
  </g>

  <!-- dial ring -->
  <circle cx="252" cy="252" r="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="8"/>

  <!-- hour markers, every 45 degrees -->
  <g stroke="#FFFFFF" stroke-width="16" stroke-linecap="round">
    <line x1="252" y1="152" x2="252" y2="140"/>
    <line x1="252" y1="352" x2="252" y2="364"/>
    <line x1="152" y1="252" x2="140" y2="252"/>
    <line x1="352" y1="252" x2="364" y2="252"/>
    <line x1="181.3" y1="181.3" x2="172.8" y2="172.8"/>
    <line x1="322.7" y1="181.3" x2="331.2" y2="172.8"/>
    <line x1="181.3" y1="322.7" x2="172.8" y2="331.2"/>
    <line x1="322.7" y1="322.7" x2="331.2" y2="331.2"/>
  </g>

  <!-- hands -->
  <path d="M188 224 L240 272 L300 192" fill="none" stroke="#FFFFFF" stroke-width="22"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
